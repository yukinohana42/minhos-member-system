name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/ghost-theme/package-lock.json
            packages/apps-script/package-lock.json

      - name: Install root harness
        run: npm ci

      - name: Install implementation package dependencies
        run: npm run install:packages

      - name: Run complete verification
        run: npm run verify:ci

      - name: Record Ghost theme checksum
        working-directory: packages/ghost-theme/dist
        run: sha256sum minhos-membership-1.0.0.zip > SHA256SUMS.txt

      - name: Upload verified Ghost theme
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minhos-ghost-theme-${{ github.sha }}
          path: |
            packages/ghost-theme/dist/minhos-membership-1.0.0.zip
            packages/ghost-theme/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
