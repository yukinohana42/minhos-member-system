name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/ghost-theme/package-lock.json
            packages/apps-script/package-lock.json

      - name: Install root harness
        run: npm ci

      - name: Install implementation package dependencies
        run: npm run install:packages

      - name: Run complete verification
        run: npm run verify:ci

      - name: Record Ghost theme checksum
        working-directory: packages/ghost-theme/dist
        run: sha256sum minhos-membership-1.0.0.zip > SHA256SUMS.txt

      - name: Upload verified Ghost theme
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minhos-ghost-theme-${{ github.sha }}
          path: |
            packages/ghost-theme/dist/minhos-membership-1.0.0.zip
            packages/ghost-theme/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
